# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# Render Blueprint: Audio Transcript Service
#
# One Docker web service. The image is built from ./Dockerfile, which exports Whisper to ONNX in a
# throwaway build stage, so nothing downloads at boot. Uploads are deleted once decoded and jobs live in
# memory; the small disk at /data only keeps the Benchmark tab's recordings, reference clips and runs.
# A disk-backed service runs as one instance and restarts in place on deploys (brief downtime).
#
# API_TOKEN is generated by Render: copy it from the service's Environment tab and send it as
# `X-API-Key: <token>` or `Authorization: Bearer <token>`.

services:
  - type: web
    name: audio-transcript
    runtime: docker
    # Starter = 0.5 CPU / 512 MB. whisper-tiny with WHISPER_LOW_MEMORY and one ONNX thread fits; standard
    # (1 CPU / 2 GB) transcribes ~2x faster and fits whisper-base or WHISPER_LOW_MEMORY=false.
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # 503 if the Whisper model failed to load, so a broken image is never promoted.
    healthCheckPath: /healthz
    disk:
      name: benchmark-data
      mountPath: /data
      sizeGB: 1
    autoDeployTrigger: commit
    buildFilter:
      # render.yaml is included because WHISPER_MODEL only takes effect when the image is rebuilt.
      paths:
        - render.yaml
        - app/**
        - scripts/**
        - main.py
        - Dockerfile
        - .dockerignore
        - requirements.txt
        - requirements-export.txt
      ignoredPaths:
        - "**/*.md"
    envVars:
      # --- Speech model (also passed to the Docker build as a build arg) ---
      - key: WHISPER_MODEL
        value: openai/whisper-tiny
      # More models for the Benchmark tab, exported into the image (space-separated), e.g.
      # "openai/whisper-base". A run keeps the service's model loaded and loads one more: on starter
      # (512 MB) compare at most tiny models; use standard (2 GB) for base or small.
      - key: BENCHMARK_MODELS
        value: ""
      - key: DEFAULT_LANGUAGE
        value: auto
      # Match ONNX Runtime's thread pools to the plan's CPUs (starter/standard = 1, pro = 2).
      - key: ONNX_THREADS
        value: "1"
      # Skip ONNX Runtime's pre-packed weight copies: ~25 MB less RAM, transcription ~1.5x slower.
      - key: WHISPER_LOW_MEMORY
        value: "true"
      # Decoding defaults (requests can override them): re-decode repetitive or unsure windows, and
      # prompt each window with the text before it.
      - key: TEMPERATURE_FALLBACK
        value: "true"
      - key: CONDITION_ON_PREVIOUS_TEXT
        value: "true"

      # --- Access control ---
      - key: API_TOKEN
        generateValue: true

      # --- Upload and worker limits ---
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: MAX_AUDIO_SECONDS
        value: "1800"
      - key: WORKER_CONCURRENCY
        value: "1"
      - key: MAX_QUEUE_SIZE
        value: "20"
